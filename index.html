<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CoolBoard Studio</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#070a14;
}

button,
input{
    font-family:inherit;
}


/* =========================================
   APP
========================================= */

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
    radial-gradient(
        circle at 20% 0%,
        rgba(86,77,180,.25),
        transparent 30%
    ),
    radial-gradient(
        circle at 90% 30%,
        rgba(28,114,190,.15),
        transparent 30%
    ),
    linear-gradient(
        135deg,
        #070a14,
        #0c1022,
        #080c18
    );

    overflow:hidden;
}


/* =========================================
   HEADER
========================================= */

.header{

    height:48px;
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    background:
    rgba(10,14,30,.85);

    backdrop-filter:blur(15px);

    border-bottom:
    1px solid
    rgba(255,255,255,.08);

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.2);

    z-index:50;
}


.logo{

    color:#fff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:.3px;

    text-shadow:
    0 0 15px
    rgba(123,92,255,.5);
}


.logo span{

    color:#9d85ff;

}


.mode-switch{

    display:flex;

    gap:5px;

}


.mode-btn{

    border:none;

    padding:7px 9px;

    border-radius:10px;

    background:
    linear-gradient(
        145deg,
        #222b4a,
        #141a30
    );

    color:#dce3ff;

    font-size:9px;

    cursor:pointer;

    box-shadow:
    3px 3px 8px
    rgba(0,0,0,.35),
    inset 1px 1px 2px
    rgba(255,255,255,.05);

    transition:.25s;

}


.mode-btn.active{

    background:
    linear-gradient(
        135deg,
        #795dff,
        #248ee8
    );

    color:white;

    box-shadow:
    0 0 18px
    rgba(103,88,255,.4);

}


/* =========================================
   BOARD AREA
========================================= */

.board-area{

    flex:1;

    min-height:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:6px;

    overflow:hidden;

}


/* =========================================
   BOARD
========================================= */

.board{

    width:100%;
    height:100%;

    max-width:1200px;

    position:relative;

    overflow:hidden;

    border-radius:14px;

    background:#e4e6ea;

    box-shadow:

    0 20px 50px
    rgba(0,0,0,.45),

    inset
    0 0 0 1px
    rgba(255,255,255,.7);

    touch-action:none;

}


/* subtle board texture */

.board::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.12;

    background-image:

    linear-gradient(
        rgba(0,0,0,.04) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,0,0,.04) 1px,
        transparent 1px
    );

    background-size:
    25px 25px;

}


/* =========================================
   CANVAS
========================================= */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    touch-action:none;

}


/* =========================================
   SELECTION
========================================= */

.selection-box{

    position:absolute;

    display:none;

    pointer-events:none;

    border:
    2px dashed
    #755cff;

    border-radius:6px;

    box-shadow:

    0 0 0 1px
    rgba(255,255,255,.7),

    0 0 15px
    rgba(103,85,255,.7);

    z-index:30;

    animation:
    selectionGlow
    1s infinite alternate;

}


@keyframes selectionGlow{

    from{

        box-shadow:
        0 0 8px
        rgba(105,82,255,.5);

    }

    to{

        box-shadow:
        0 0 20px
        rgba(105,82,255,.9);

    }

}


/* =========================================
   SELECTED OBJECT
========================================= */

.selected-canvas{

    position:absolute;

    display:none;

    z-index:20;

    cursor:grab;

    touch-action:none;

    filter:
    drop-shadow(
        0 6px 12px
        rgba(0,0,0,.25)
    );

}


.selected-canvas.dragging{

    cursor:grabbing;

}


/* =========================================
   EMOJI
========================================= */

.emoji-object{

    position:absolute;

    z-index:15;

    font-size:42px;

    line-height:1;

    cursor:grab;

    user-select:none;

    touch-action:none;

    filter:

    drop-shadow(
        0 5px 5px
        rgba(0,0,0,.2)
    );

}


.emoji-object.selected{

    outline:
    2px dashed
    #765fff;

    outline-offset:5px;

    border-radius:8px;

}


/* =========================================
   OBJECT MENU
========================================= */

.object-menu{

    position:absolute;

    display:none;

    gap:5px;

    padding:5px;

    z-index:100;

    background:

    rgba(15,20,42,.95);

    backdrop-filter:
    blur(15px);

    border:

    1px solid
    rgba(255,255,255,.12);

    border-radius:10px;

    box-shadow:

    0 10px 30px
    rgba(0,0,0,.35);

}


.object-menu button{

    border:none;

    color:white;

    background:

    linear-gradient(
        145deg,
        #2d3962,
        #1c2544
    );

    border-radius:7px;

    padding:7px 9px;

    font-size:10px;

}


/* =========================================
   TOOLBAR
========================================= */

.toolbar{

    min-height:198px;
    max-height:198px;

    padding:6px;

    display:flex;

    flex-direction:column;

    gap:5px;

    background:

    linear-gradient(
        180deg,
        #141b34,
        #0b1022
    );

    border-top:

    1px solid
    rgba(255,255,255,.08);

    box-shadow:

    0 -10px 25px
    rgba(0,0,0,.18);

    z-index:60;

}


/* =========================================
   TOOL ROW
========================================= */

.tool-row{

    display:flex;

    gap:5px;

    overflow-x:auto;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

    padding-bottom:2px;

}


.tool-row::-webkit-scrollbar{

    display:none;

}


/* =========================================
   TOOL BUTTON
========================================= */

.tool{

    min-width:48px;

    height:42px;

    flex-shrink:0;

    border:none;

    border-radius:10px;

    color:#edf0ff;

    background:

    linear-gradient(
        145deg,
        #25305a,
        #18203c
    );

    box-shadow:

    3px 3px 8px
    rgba(0,0,0,.3),

    inset
    1px 1px 2px
    rgba(255,255,255,.06);

    font-size:7px;

    cursor:pointer;

    transition:
    transform .15s,
    box-shadow .2s;

}


.tool span{

    display:block;

    font-size:16px;

    margin-bottom:2px;

}


.tool:active{

    transform:
    scale(.94);

}


.tool.active{

    background:

    linear-gradient(
        135deg,
        #755cff,
        #258eea
    );

    box-shadow:

    0 0 15px
    rgba(101,81,255,.5);

}


/* =========================================
   SETTINGS
========================================= */

.settings{

    display:flex;

    align-items:center;

    gap:6px;

    padding:1px 3px;

}


.settings label{

    font-size:11px;

}


.settings input[type="range"]{

    flex:1;

    accent-color:#8067ff;

}


.settings input[type="color"]{

    width:32px;

    height:28px;

    padding:2px;

    border:

    1px solid
    rgba(255,255,255,.1);

    border-radius:7px;

    background:#20294b;

}


/* =========================================
   ACTIONS
========================================= */

.actions{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:5px;

}


.action{

    height:34px;

    border:none;

    border-radius:9px;

    color:#e9edff;

    background:

    linear-gradient(
        145deg,
        #273258,
        #18203c
    );

    font-size:8px;

    cursor:pointer;

}


.action:active{

    transform:
    scale(.95);

}


/* =========================================
   EMOJI PANEL
========================================= */

.emoji-panel{

    position:absolute;

    left:8px;
    right:8px;

    bottom:205px;

    display:none;

    grid-template-columns:
    repeat(8,1fr);

    gap:5px;

    max-height:170px;

    overflow-y:auto;

    padding:9px;

    z-index:150;

    border-radius:15px;

    background:

    rgba(19,25,48,.97);

    border:

    1px solid
    rgba(255,255,255,.1);

    box-shadow:

    0 15px 40px
    rgba(0,0,0,.5);

}


.emoji-panel.show{

    display:grid;

    animation:
    panelShow .2s ease;

}


@keyframes panelShow{

    from{

        opacity:0;

        transform:
        translateY(10px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


.emoji{

    height:38px;

    border:none;

    border-radius:8px;

    background:#222d50;

    font-size:19px;

    cursor:pointer;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .header{

        height:44px;
        min-height:44px;

    }

    .logo{

        font-size:12px;

    }

    .toolbar{

        min-height:192px;
        max-height:192px;

    }

    .tool{

        min-width:46px;

        height:40px;

    }

    .emoji-panel{

        bottom:198px;

        grid-template-columns:
        repeat(7,1fr);

    }

}


@media(max-height:680px){

    .toolbar{

        min-height:175px;
        max-height:175px;

    }

    .tool{

        height:38px;

    }

    .emoji-panel{

        bottom:180px;

    }

}

</style>

</head>

<script>

/* =========================================
   ELEMENTS
========================================= */

const board =
document.getElementById("board");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d",{
    willReadFrequently:true
});

const selectionBox =
document.getElementById("selectionBox");

const selectedCanvas =
document.getElementById("selectedCanvas");

const selectedCtx =
selectedCanvas.getContext("2d");

const colorPicker =
document.getElementById("colorPicker");

const sizeSlider =
document.getElementById("sizeSlider");

const boardColor =
document.getElementById("boardColor");

const emojiPanel =
document.getElementById("emojiPanel");

const objectMenu =
document.getElementById("objectMenu");


/* =========================================
   STATE
========================================= */

let currentTool =
"pencil";

let drawing =
false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let savedImage =
null;


/* SELECT MODE */

let selecting =
false;

let selectionStartX = 0;
let selectionStartY = 0;

let selectionData =
null;


/* MOVE SELECTED DRAWING */

let movingSelection =
false;

let moveOffsetX = 0;
let moveOffsetY = 0;


/* HISTORY */

let history = [];
let redoHistory = [];


/* =========================================
   RESIZE CANVAS
========================================= */

function resizeCanvas(){

    const temp =
    document.createElement("canvas");

    temp.width =
    canvas.width;

    temp.height =
    canvas.height;

    const tempCtx =
    temp.getContext("2d");

    if(
    canvas.width > 0
    ){

        tempCtx.drawImage(
            canvas,
            0,
            0
        );

    }


    canvas.width =
    board.clientWidth;

    canvas.height =
    board.clientHeight;


    if(
    temp.width > 0
    ){

        ctx.drawImage(
            temp,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}


resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =========================================
   GET POSITION
========================================= */

function getPosition(event){

    const rect =
    canvas.getBoundingClientRect();

    return{

        x:
        (event.clientX - rect.left)
        *
        (
            canvas.width /
            rect.width
        ),

        y:
        (event.clientY - rect.top)
        *
        (
            canvas.height /
            rect.height
        )

    };

}


/* =========================================
   TOOL SELECT
========================================= */

document
.querySelectorAll(".tool")
.forEach(button=>{

    button.addEventListener(
    "click",
    ()=>{

        currentTool =
        button.dataset.tool;


        document
        .querySelectorAll(".tool")
        .forEach(btn=>{

            btn.classList
            .remove("active");

        });


        button.classList
        .add("active");


        if(
        currentTool !==
        "select"
        ){

            deselectAll();

        }


        if(
        currentTool ===
        "emoji"
        ){

            toggleEmojiPanel();

        }

    });

});


/* =========================================
   POINTER DOWN ON MAIN CANVAS
========================================= */

canvas.addEventListener(
"pointerdown",
event=>{

    event.preventDefault();


    const pos =
    getPosition(event);


    /* =====================================
       SELECT MODE
    ===================================== */

    if(
    currentTool ===
    "select"
    ){

        deselectAll();


        selecting =
        true;


        selectionStartX =
        pos.x;

        selectionStartY =
        pos.y;


        selectionBox.style.display =
        "block";


        updateSelectionBox(
            pos.x,
            pos.y,
            0,
            0
        );


        return;

    }


    /* EMOJI MODE DOES NOT DRAW */

    if(
    currentTool ===
    "emoji"
    ){

        return;

    }


    /* NORMAL DRAWING */

    drawing =
    true;


    canvas.setPointerCapture(
        event.pointerId
    );


    startX =
    pos.x;

    startY =
    pos.y;


    lastX =
    pos.x;

    lastY =
    pos.y;


    savedImage =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

});


/* =========================================
   POINTER MOVE
========================================= */

canvas.addEventListener(
"pointermove",
event=>{

    const pos =
    getPosition(event);


    /* =====================================
       CREATE SELECTION
    ===================================== */

    if(
    selecting
    ){

        const x =
        Math.min(
            selectionStartX,
            pos.x
        );

        const y =
        Math.min(
            selectionStartY,
            pos.y
        );

        const width =
        Math.abs(
            pos.x -
            selectionStartX
        );

        const height =
        Math.abs(
            pos.y -
            selectionStartY
        );


        updateSelectionBox(
            x,
            y,
            width,
            height
        );

        return;

    }


    if(!drawing)
    return;


    /* =====================================
       PENCIL
    ===================================== */

    if(
    currentTool ===
    "pencil"
    ){

        ctx.save();

        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.lineWidth =
        Number(
            sizeSlider.value
        );

        ctx.strokeStyle =
        colorPicker.value;

        ctx.lineCap =
        "round";

        ctx.lineJoin =
        "round";

        ctx.globalAlpha =
        1;

        ctx.stroke();

        ctx.restore();


        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    /* =====================================
       BRUSH
       SOFT SMOOTH SHADED EFFECT
    ===================================== */

    if(
    currentTool ===
    "brush"
    ){

        ctx.save();


        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );


        /*
           MAIN SOFT BRUSH
        */

        ctx.lineWidth =
        Number(
            sizeSlider.value
        ) * 2.3;


        ctx.strokeStyle =
        colorPicker.value;


        ctx.lineCap =
        "round";

        ctx.lineJoin =
        "round";


        ctx.globalAlpha =
        .30;


        ctx.shadowColor =
        colorPicker.value;


        ctx.shadowBlur =
        Number(
            sizeSlider.value
        ) * 1.5;


        ctx.stroke();


        /*
           CENTER SMOOTH COLOR
        */

        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );


        ctx.lineWidth =
        Number(
            sizeSlider.value
        ) * 1.25;


        ctx.globalAlpha =
        .55;


        ctx.shadowBlur =
        0;


        ctx.stroke();


        ctx.restore();


        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    /* =====================================
       ERASER
       ONLY ERASES WHILE DRAGGING
    ===================================== */

    if(
    currentTool ===
    "eraser"
    ){

        ctx.save();


        ctx.globalCompositeOperation =
        "destination-out";


        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );


        ctx.lineWidth =
        Number(
            sizeSlider.value
        ) * 3;


        ctx.lineCap =
        "round";


        ctx.lineJoin =
        "round";


        ctx.stroke();


        ctx.restore();


        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    /* =====================================
       SHAPES
    ===================================== */

    drawShape(
        pos.x,
        pos.y
    );

});


/* =========================================
   POINTER UP
========================================= */

canvas.addEventListener(
"pointerup",
event=>{


    /* =====================================
       FINISH SELECTION
    ===================================== */

    if(
    selecting
    ){

        selecting =
        false;


        const pos =
        getPosition(event);


        createSelectedObject(
            selectionStartX,
            selectionStartY,
            pos.x,
            pos.y
        );


        return;

    }


    /* NORMAL DRAWING */

    if(drawing){

        drawing =
        false;

        saveHistory();

    }

});


canvas.addEventListener(
"pointercancel",
()=>{

    drawing =
    false;

    selecting =
    false;

});


/* =========================================
   SELECTION BOX UPDATE
========================================= */

function updateSelectionBox(
x,
y,
width,
height
){

    selectionBox.style.left =
    x + "px";


    selectionBox.style.top =
    y + "px";


    selectionBox.style.width =
    width + "px";


    selectionBox.style.height =
    height + "px";

}


/* =========================================
   CREATE MOVABLE SELECTED AREA
========================================= */

function createSelectedObject(
x1,
y1,
x2,
y2
){

    const x =
    Math.floor(
        Math.min(x1,x2)
    );

    const y =
    Math.floor(
        Math.min(y1,y2)
    );


    const width =
    Math.floor(
        Math.abs(x2-x1)
    );


    const height =
    Math.floor(
        Math.abs(y2-y1)
    );


    /* TOO SMALL */

    if(
    width < 8 ||
    height < 8
    ){

        selectionBox.style.display =
        "none";

        return;

    }


    /*
       COPY SELECTED AREA
    */

    const imageData =
    ctx.getImageData(
        x,
        y,
        width,
        height
    );


    selectionData =
    {
        x,
        y,
        width,
        height,
        imageData
    };


    /*
       REMOVE FROM MAIN BOARD
    */

    ctx.clearRect(
        x,
        y,
        width,
        height
    );


    /*
       CREATE MOVABLE CANVAS
    */

    selectedCanvas.width =
    width;

    selectedCanvas.height =
    height;


    selectedCtx.putImageData(
        imageData,
        0,
        0
    );


    selectedCanvas.style.left =
    x + "px";

    selectedCanvas.style.top =
    y + "px";


    selectedCanvas.style.display =
    "block";


    selectionBox.style.display =
    "none";


    showObjectMenu(
        x,
        y
    );


}


/* =========================================
   MOVE SELECTED DRAWING
========================================= */

selectedCanvas.addEventListener(
"pointerdown",
event=>{

    event.preventDefault();

    event.stopPropagation();


    if(
    currentTool !==
    "select"
    )
    return;


    movingSelection =
    true;


    selectedCanvas.classList
    .add("dragging");


    const rect =
    selectedCanvas.getBoundingClientRect();


    moveOffsetX =
    event.clientX -
    rect.left;


    moveOffsetY =
    event.clientY -
    rect.top;


    selectedCanvas
    .setPointerCapture(
        event.pointerId
    );

});


selectedCanvas.addEventListener(
"pointermove",
event=>{

    if(!movingSelection)
    return;


    const boardRect =
    board.getBoundingClientRect();


    let x =
    event.clientX -
    boardRect.left -
    moveOffsetX;


    let y =
    event.clientY -
    boardRect.top -
    moveOffsetY;


    /*
       KEEP INSIDE BOARD
    */

    x =
    Math.max(
        0,
        Math.min(
            x,
            board.clientWidth -
            selectedCanvas.width
        )
    );


    y =
    Math.max(
        0,
        Math.min(
            y,
            board.clientHeight -
            selectedCanvas.height
        )
    );


    selectedCanvas.style.left =
    x + "px";


    selectedCanvas.style.top =
    y + "px";


    showObjectMenu(
        x,
        y
    );

});


selectedCanvas.addEventListener(
"pointerup",
()=>{

    movingSelection =
    false;


    selectedCanvas.classList
    .remove("dragging");

});


/* =========================================
   FINALIZE SELECTION
========================================= */

function placeSelectionOnBoard(){

    if(
    selectedCanvas.style.display !==
    "block"
    )
    return;


    const x =
    parseFloat(
        selectedCanvas.style.left
    );


    const y =
    parseFloat(
        selectedCanvas.style.top
    );


    ctx.drawImage(
        selectedCanvas,
        x,
        y
    );


    selectedCanvas.style.display =
    "none";


    selectionData =
    null;


    objectMenu.style.display =
    "none";


    saveHistory();

}


/* =========================================
   DELETE SELECTED
========================================= */

function deleteSelected(){


    /*
       DELETE MOVABLE DRAWING
    */

    if(
    selectedCanvas.style.display ===
    "block"
    ){

        selectedCanvas.style.display =
        "none";

        objectMenu.style.display =
        "none";

        selectionData =
        null;

        saveHistory();

        return;

    }


    /*
       DELETE EMOJI
    */

    if(
    selectedEmoji
    ){

        selectedEmoji.remove();

        selectedEmoji =
        null;

        objectMenu.style.display =
        "none";

    }

}


/* =========================================
   DESELECT / DONE
========================================= */

function deselectAll(){


    /*
       PLACE DRAWING BACK
    */

    if(
    selectedCanvas.style.display ===
    "block"
    ){

        placeSelectionOnBoard();

    }


    /*
       EMOJI
    */

    document
    .querySelectorAll(
        ".emoji-object"
    )
    .forEach(e=>{

        e.classList
        .remove("selected");

    });


    selectedEmoji =
    null;


    selectionBox.style.display =
    "none";


    objectMenu.style.display =
    "none";

}


/* =========================================
   SHAPES
========================================= */

function drawShape(x,y){

    ctx.putImageData(
        savedImage,
        0,
        0
    );


    ctx.save();


    ctx.beginPath();


    ctx.strokeStyle =
    colorPicker.value;


    ctx.lineWidth =
    Number(
        sizeSlider.value
    );


    ctx.lineCap =
    "round";


    ctx.lineJoin =
    "round";


    const w =
    x-startX;


    const h =
    y-startY;


    /* LINE */

    if(
    currentTool ===
    "line"
    ){

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

    }


    /* RECTANGLE */

    if(
    currentTool ===
    "rectangle"
    ){

        ctx.strokeRect(
            startX,
            startY,
            w,
            h
        );

    }


    /* CIRCLE */

    if(
    currentTool ===
    "circle"
    ){

        const radius =
        Math.sqrt(
            w*w +
            h*h
        );


        ctx.arc(
            startX,
            startY,
            radius,
            0,
            Math.PI*2
        );


        ctx.stroke();

    }


    /* TRIANGLE */

    if(
    currentTool ===
    "triangle"
    ){

        ctx.moveTo(
            startX + w/2,
            startY
        );


        ctx.lineTo(
            startX,
            startY+h
        );


        ctx.lineTo(
            startX+w,
            startY+h
        );


        ctx.closePath();


        ctx.stroke();

    }


    /* STAR */

    if(
    currentTool ===
    "star"
    ){

        drawStar(
            startX+w/2,
            startY+h/2,
            Math.max(
                Math.abs(w),
                Math.abs(h)
            )/2
        );


        ctx.stroke();

    }


    /* ARROW */

    if(
    currentTool ===
    "arrow"
    ){

        drawArrow(
            startX,
            startY,
            x,
            y
        );

    }


    ctx.restore();

}


/* =========================================
   STAR
========================================= */

function drawStar(
cx,
cy,
radius
){

    const inner =
    radius*.45;


    for(
    let i=0;
    i<10;
    i++
    ){

        const angle =
        -Math.PI/2 +
        i*Math.PI/5;


        const r =
        i%2===0
        ?
        radius
        :
        inner;


        const x =
        cx +
        Math.cos(angle)*r;


        const y =
        cy +
        Math.sin(angle)*r;


        if(i===0){

            ctx.moveTo(x,y);

        }

        else{

            ctx.lineTo(x,y);

        }

    }


    ctx.closePath();

}


/* =========================================
   ARROW
========================================= */

function drawArrow(
x1,
y1,
x2,
y2
){

    const angle =
    Math.atan2(
        y2-y1,
        x2-x1
    );


    const head =
    18;


    ctx.moveTo(
        x1,
        y1
    );


    ctx.lineTo(
        x2,
        y2
    );


    ctx.lineTo(

        x2 -
        head *
        Math.cos(
            angle-Math.PI/6
        ),

        y2 -
        head *
        Math.sin(
            angle-Math.PI/6
        )

    );


    ctx.moveTo(
        x2,
        y2
    );


    ctx.lineTo(

        x2 -
        head *
        Math.cos(
            angle+Math.PI/6
        ),

        y2 -
        head *
        Math.sin(
            angle+Math.PI/6
        )

    );


    ctx.stroke();

}


/* =========================================
   EMOJIS
========================================= */

const emojis=[

"😀","😃","😄","😁",
"😂","🤣","😊","😍",
"🥰","😎","🤩","🥳",

"😭","😡","😴","🤔",

"👍","👏","🙌","💪",
"🙏","❤️","💙","💜",

"💚","💛","🔥","✨",
"⭐","🌈","☀️","🌙",

"🌸","🌹","🍀","🦋",
"🐶","🐱","🐦","🚀",

"🎈","🎉","🎂","🍕",
"🍔","⚽","🏆","🎮",

"📚","✏️"

];


emojis.forEach(emoji=>{

    const button =
    document.createElement("button");


    button.className =
    "emoji";


    button.textContent =
    emoji;


    button.onclick =

        addEmoji(
            emoji
        );

    };


    emojiPanel.appendChild(
        button
    );

});


function toggleEmojiPanel(){

    emojiPanel.classList
    .toggle("show");

}


/* =========================================
   EMOJI MOVE
========================================= */

let selectedEmoji =
null;


function addEmoji(emoji){

    const element =
    document.createElement("div");


    element.className =
    "emoji-object";


    element.textContent =
    emoji;


    element.style.left =
    "50%";


    element.style.top =
    "50%";


    element.style.transform =
    "translate(-50%,-50%)";


    board.appendChild(
        element
    );


    let dragging =
    false;

    let offsetX =
    0;

    let offsetY =
    0;


    element.addEventListener(
    "pointerdown",
    event=>{

        if(
        currentTool !==
        "select"
        )
        return;


        event.preventDefault();

        event.stopPropagation();


        deselectAll();


        selectedEmoji =
        element;


        document
        .querySelectorAll(
            ".emoji-object"
        )
        .forEach(e=>{

            e.classList
            .remove("selected");

        });


        element.classList
        .add("selected");


        dragging =
        true;


        const rect =
        element.getBoundingClientRect();


        offsetX =
        event.clientX -
        rect.left;


        offsetY =
        event.clientY -
        rect.top;


        element
        .setPointerCapture(
            event.pointerId
        );


        showObjectMenu(
            parseFloat(
                element.style.left
            ) || 0,

            parseFloat(
                element.style.top
            ) || 0
        );

    });


    element.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
        return;


        const boardRect =
        board.getBoundingClientRect();


        let x =
        event.clientX -
        boardRect.left -
        offsetX;


        let y =
        event.clientY -
        boardRect.top -
        offsetY;


        element.style.left =
        x+"px";


        element.style.top =
        y+"px";


        element.style.transform =
        "none";


        showObjectMenu(
            x,
            y
        );

    });


    element.addEventListener(
    "pointerup",
    ()=>{

        dragging =
        false;

    });

}


/* =========================================
   OBJECT MENU
========================================= */

function showObjectMenu(x,y){

    objectMenu.style.display =
    "flex";


    const menuWidth =
    120;


    let menuX =
    x;


    let menuY =
    y-45;


    if(menuY<5){

        menuY =
        y+40;

    }


    objectMenu.style.left =
    Math.max(
        5,
        Math.min(
            menuX,
            board.clientWidth-menuWidth
        )
    )+"px";


    objectMenu.style.top =
    Math.max(
        5,
        menuY
    )+"px";

}


/* =========================================
   HISTORY
========================================= */

function saveHistory(){

    const data =
    canvas.toDataURL();


    history.push(data);


    if(
    history.length>40
    ){

        history.shift();

    }


    redoHistory=[];


    localStorage.setItem(
        "coolboardDrawing",
        data
    );

}


function undo(){

    deselectAll();


    if(
    history.length<2
    )
    return;


    redoHistory.push(
        history.pop()
    );


    restoreImage(
        history[
            history.length-1
        ]
    );

}


function redo(){

    deselectAll();


    if(
    redoHistory.length===0
    )
    return;


    const data =
    redoHistory.pop();


    history.push(data);


    restoreImage(data);

}


function restoreImage(data){

    const image =
    new Image();


    image.onload =
    ()=>{

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );

    };


    image.src =
    data;

}


/* =========================================
   CLEAR BOARD
========================================= */

function clearBoard(){

    if(
    !confirm(
        "বোর্ড সম্পূর্ণ পরিষ্কার করতে চাও?"
    )
    )
    return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    document
    .querySelectorAll(
        ".emoji-object"
    )
    .forEach(e=>e.remove());


    deselectAll();


    saveHistory();

}


/* =========================================
   BOARD COLOR
========================================= */

boardColor.addEventListener(
"input",
()=>{

    board.style.background =
    boardColor.value;

});


/* =========================================
   EXPORT
========================================= */

function exportBoard(){

    deselectAll();


    const exportCanvas =
    document.createElement(
        "canvas"
    );


    exportCanvas.width =
    canvas.width;


    exportCanvas.height =
    canvas.height;


    const exportCtx =
    exportCanvas.getContext(
        "2d"
    );


    /* BOARD BACKGROUND */

    exportCtx.fillStyle =
    boardColor.value;


    exportCtx.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
    );


    /* DRAWING */

    exportCtx.drawImage(
        canvas,
        0,
        0
    );


    /* EMOJIS NOT RENDERED PERFECTLY
       INTO CANVAS ON EVERY DEVICE,
       SO DRAWING IS EXPORTED.
    */


    const link =
    document.createElement("a");


    link.download =
    "CoolBoard.png";


    link.href =
    exportCanvas.toDataURL(
        "image/png"
    );


    link.click();

}


/* =========================================
   MODE SYSTEM
========================================= */

function setMode(
mode,
button
){

    document
    .querySelectorAll(
        ".mode-btn"
    )
    .forEach(btn=>{

        btn.classList
        .remove("active");

    });


    button.classList
    .add("active");


    document
    .querySelectorAll(
        ".advanced"
    )
    .forEach(tool=>{

        tool.style.display =
        mode==="advanced"
        ?
        "block"
        :
        "none";

    });


    if(
    mode==="kids"
    ){

        /*
           IF ADVANCED TOOL ACTIVE,
           RETURN TO PENCIL
        */

        const activeTool =
        document.querySelector(
            ".tool.active"
        );


        if(
        activeTool &&
        activeTool.classList
        .contains("advanced")
        ){

            currentTool =
            "pencil";


            document
            .querySelectorAll(".tool")
            .forEach(
                t=>t.classList
                .remove("active")
            );


            document
            .querySelector(
                '[data-tool="pencil"]'
            )
            .classList
            .add("active");

        }

    }

}


/* =========================================
   INITIAL HISTORY
========================================= */

saveHistory();


/* =========================================
   LOAD SAVED DRAWING
========================================= */

const savedBoard =
localStorage.getItem(
    "coolboardDrawing"
);


if(savedBoard){

    setTimeout(
    ()=>{

        restoreImage(
            savedBoard
        );

        history=[
            savedBoard
        ];

    },
    100
    );

}
