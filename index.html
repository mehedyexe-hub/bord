<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0b1020">

<title>CoolBoard Studio</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #080b16;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    overflow: hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    height: 100%;
    flex-shrink: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 15px;

    background:
        linear-gradient(
            180deg,
            #121936,
            #0c1024
        );

    border-right:
        1px solid
        rgba(255,255,255,.08);

    z-index: 100;

    scroll-behavior: smooth;

    overscroll-behavior: contain;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

    scrollbar-width: thin;
    scrollbar-color: #725cff #141a30;
}

/* =========================
   NICE SCROLLBAR
========================= */

.sidebar::-webkit-scrollbar {
    width: 7px;
}

.sidebar::-webkit-scrollbar-track {
    background:
        rgba(255,255,255,.04);

    border-radius: 20px;
}

.sidebar::-webkit-scrollbar-thumb {

    background:
        linear-gradient(
            180deg,
            #7b61ff,
            #37a7ff
        );

    border-radius: 20px;

    border: 2px solid transparent;

    background-clip: padding-box;
}

.sidebar::-webkit-scrollbar-thumb:hover {

    background:
        linear-gradient(
            180deg,
            #9b89ff,
            #55baff
        );

    background-clip: padding-box;
}

/* =========================
   LOGO
========================= */

.logo {
    margin-bottom: 18px;
}

.logo h1 {
    margin: 0;

    font-size: 22px;

    background:
        linear-gradient(
            90deg,
            #9a7cff,
            #55c9ff
        );

    -webkit-background-clip: text;

    color: transparent;
}

.logo p {
    margin: 5px 0 0;

    color: #8f99bf;

    font-size: 12px;
}

/* =========================
   MODE SWITCH
========================= */

.mode-switch {
    display: flex;

    gap: 8px;

    margin-bottom: 12px;
}

.mode-btn {

    flex: 1;

    border: none;

    padding: 11px 6px;

    border-radius: 12px;

    cursor: pointer;

    background: #1d2544;

    color: #dce4ff;

    transition: .25s;
}

.mode-btn.active {

    background:
        linear-gradient(
            135deg,
            #745cff,
            #2daeff
        );

    color: white;

    box-shadow:
        0 5px 20px
        rgba(110,90,255,.25);
}

/* =========================
   SECTION
========================= */

.section {

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 15px;

    padding: 11px;

    margin-bottom: 12px;
}

.section-title {

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: #8994bb;

    margin-bottom: 9px;
}

/* =========================
   TOOL GRID
========================= */

.tool-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;
}

.tool {

    min-height: 58px;

    border: none;

    border-radius: 11px;

    background: #1b2340;

    color: white;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;
}

.tool span {

    display: block;

    font-size: 20px;

    margin-bottom: 3px;
}

.tool:hover,
.tool.active {

    background: #2b3761;

    outline:
        1px solid
        #7b65ff;
}

/* =========================
   CONTROLS
========================= */

.control-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 10px 0;
}

.control-row label {

    width: 55px;

    color: #a7b0d1;

    font-size: 12px;
}

input[type="range"] {

    flex: 1;

    accent-color: #795fff;
}

input[type="color"] {

    width: 45px;

    height: 34px;

    border: none;

    border-radius: 8px;

    background: transparent;

    cursor: pointer;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 7px;
}

.action-btn {

    border: none;

    border-radius: 10px;

    padding: 10px 6px;

    background: #20294a;

    color: white;

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.action-btn:hover {

    background: #2c3760;
}

.danger {

    background: #4a2638;
}

/* =========================
   EMOJI PANEL
========================= */

.emoji-panel {

    display: none;

    grid-template-columns:
        repeat(6,1fr);

    gap: 5px;

    max-height: 180px;

    overflow-y: auto;

    margin-top: 10px;

    padding-right: 3px;

    -webkit-overflow-scrolling: touch;
}

.emoji-panel.show {

    display: grid;
}

.emoji {

    border: none;

    border-radius: 8px;

    padding: 6px 2px;

    background: #20294a;

    font-size: 18px;

    cursor: pointer;
}

/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;

    flex-direction: column;
}

/* =========================
   TOPBAR
========================= */

.topbar {

    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background:
        rgba(12,16,34,.96);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.status {

    font-size: 12px;

    color: #9ca8ce;
}

.status strong {

    color: #eeeaff;
}

.top-actions {

    display: flex;

    gap: 7px;
}

.icon-btn {

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 10px;

    background: #20294a;

    color: white;

    font-size: 17px;

    cursor: pointer;
}

/* =========================
   BOARD AREA
========================= */

.board-area {

    flex: 1;

    min-height: 0;

    padding: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: auto;

    background:
        radial-gradient(
            circle at center,
            rgba(82,101,255,.08),
            transparent 60%
        );
}

/* =========================
   WHITEBOARD
========================= */

.board {

    width: min(100%,1200px);

    height: 100%;

    min-height: 400px;

    position: relative;

    overflow: hidden;

    background: #e8e9ed;

    border-radius: 16px;

    box-shadow:
        0 15px 60px
        rgba(0,0,0,.4);

    touch-action: none;
}

canvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    touch-action: none;

    cursor: crosshair;

    z-index: 2;
}

/* =========================
   EMOJI OBJECT
========================= */

.emoji-object {

    position: absolute;

    z-index: 10;

    font-size: 42px;

    user-select: none;

    touch-action: none;

    cursor: grab;

    transform:
        translate(-50%,-50%);
}

.emoji-object.selected {

    outline:
        2px dashed
        #745cff;

    outline-offset: 5px;

    border-radius: 8px;
}

/* =========================
   SELECTION MENU
========================= */

.selection-menu {

    display: none;

    position: absolute;

    z-index: 30;

    background: #131a32;

    border:
        1px solid
        rgba(255,255,255,.12);

    padding: 5px;

    border-radius: 10px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.3);
}

.selection-menu button {

    border: none;

    border-radius: 7px;

    padding: 7px 9px;

    background: #29345a;

    color: white;

    cursor: pointer;
}

/* =========================
   MOBILE HANDLE
========================= */

.mobile-handle {

    display: none;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:800px) {

    .app {

        height: 100dvh;
    }

    .sidebar {

        position: fixed;

        left: 0;

        bottom: 0;

        width: 100%;

        height: 62dvh;

        padding: 10px 12px 20px;

        border-radius:
            20px 20px 0 0;

        border-right: none;

        border-top:
            1px solid
            rgba(255,255,255,.1);

        transform:
            translateY(
                calc(100% - 52px)
            );

        transition:
            transform .35s ease;

        box-shadow:
            0 -10px 40px
            rgba(0,0,0,.4);

        z-index: 200;
    }

    .sidebar.open {

        transform:
            translateY(0);
    }

    .mobile-handle {

        display: block;

        text-align: center;

        color: #aeb8df;

        padding: 9px;

        cursor: pointer;

        font-size: 12px;

        border-bottom:
            1px solid
            rgba(255,255,255,.06);

        margin-bottom: 10px;
    }

    .logo {

        display: none;
    }

    .board-area {

        padding: 8px;

        padding-bottom: 60px;
    }

    .board {

        width: 100%;

        height: 100%;

        min-height: 300px;

        border-radius: 12px;
    }

    .tool-grid {

        grid-template-columns:
            repeat(4,1fr);
    }

    .tool {

        min-height: 52px;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

<div class="mobile-handle"
onclick="toggleSidebar()">
⬆️ Scroll & Tools Panel
</div>

<div class="logo">

<h1>✨ CoolBoard</h1>

<p>Draw • Learn • Create</p>

</div>

<!-- MODE -->

<div class="mode-switch">

<button class="mode-btn active"
onclick="setMode('kids',this)">
👶 Kids </button>

<button class="mode-btn"
onclick="setMode('advanced',this)">
🚀 Advanced </button>

</div>

<!-- BASIC TOOLS -->

<div class="section">

<div class="section-title">
Basic Tools
</div>

<div class="tool-grid">

<button class="tool active"
data-tool="pencil"> <span>✏️</span>
Pencil </button>

<button class="tool"
data-tool="brush"> <span>🖌️</span>
Brush </button>

<button class="tool"
data-tool="eraser"> <span>🧽</span>
Eraser </button>

<button class="tool"
data-tool="select"> <span>🎯</span>
Select </button>

<button class="tool"
data-tool="emoji"
onclick="toggleEmojiPanel()"> <span>😀</span>
Emoji </button>

<button class="tool"
data-tool="line"> <span>➖</span>
Line </button>

</div>

</div>

<!-- DRAW SETTINGS -->

<div class="section">

<div class="section-title">
Drawing Settings
</div>

<div class="control-row">

<label>Color</label>

<input type="color"
id="colorPicker"
value="#222222">

</div>

<div class="control-row">

<label>Size</label>

<input type="range"
id="sizeSlider"
min="1"
max="40"
value="5">

</div>

</div>

<!-- EMOJI -->

<div class="section">

<button class="action-btn"
style="width:100%"
onclick="toggleEmojiPanel()">

😀 Open Emoji

</button>

<div class="emoji-panel"
id="emojiPanel">
</div>

</div>

<!-- ADVANCED -->

<div class="section advanced-only"
style="display:none">

<div class="section-title">
Advanced Shapes
</div>

<div class="tool-grid">

<button class="tool"
data-tool="circle"> <span>⭕</span>
Circle </button>

<button class="tool"
data-tool="rectangle"> <span>▭</span>
Rectangle </button>

<button class="tool"
data-tool="triangle"> <span>🔺</span>
Triangle </button>

<button class="tool"
data-tool="star"> <span>⭐</span>
Star </button>

<button class="tool"
data-tool="arrow"> <span>➡️</span>
Arrow </button>

<button class="tool"
data-tool="square"> <span>⬜</span>
Square </button>

</div>

</div>

<!-- BOARD COLOR -->

<div class="section">

<div class="section-title">
Board Settings
</div>

<div class="control-row">

<label>Board</label>

<input type="color"
id="boardColor"
value="#e8e9ed">

</div>

</div>

<!-- ACTIONS -->

<div class="section">

<div class="section-title">
Actions
</div>

<div class="actions">

<button class="action-btn"
onclick="undo()">
↩ Undo </button>

<button class="action-btn"
onclick="redo()">
↪ Redo </button>

<button class="action-btn"
onclick="exportBoard()">
🖼 Save </button>

<button class="action-btn danger"
onclick="clearBoard()">
🗑 Clear </button>

</div>

</div>

</aside>

<!-- MAIN -->

<main class="main">

<header class="topbar">

<div class="status">

<strong id="modeStatus">
👶 Kids Mode
</strong>

<span id="toolStatus">
• Pencil
</span>

</div>

<div class="top-actions">

<button class="icon-btn"
onclick="toggleSidebar()">
🛠️ </button>

</div>

</header>

<div class="board-area">

<div class="board"
id="board">

<canvas id="canvas"></canvas>

<div class="selection-menu"
id="selectionMenu">

<button
onclick="deleteSelected()">
🗑 Delete </button>

</div>

</div>

</div>

</main>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const board =
document.getElementById("board");

const colorPicker =
document.getElementById("colorPicker");

const sizeSlider =
document.getElementById("sizeSlider");

const boardColor =
document.getElementById("boardColor");

const emojiPanel =
document.getElementById("emojiPanel");

const selectionMenu =
document.getElementById("selectionMenu");


/* =========================
   STATE
========================= */

let currentTool = "pencil";

let drawing = false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let savedImage = null;

let history = [];
let redoHistory = [];

let selectedObject = null;


/* =========================
   CANVAS RESIZE
========================= */

function resizeCanvas() {

    const oldData =
    canvas.toDataURL();

    canvas.width =
    board.clientWidth;

    canvas.height =
    board.clientHeight;

    if(oldData &&
       oldData.length > 10) {

        const image =
        new Image();

        image.onload = () => {

            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );

        };

        image.src =
        oldData;
    }
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   TOOL SELECT
========================= */

document
.querySelectorAll(".tool")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tool")
            .forEach(b =>
                b.classList.remove("active")
            );

            button
            .classList
            .add("active");

            currentTool =
            button.dataset.tool;

            document
            .getElementById("toolStatus")
            .textContent =
            "• " + currentTool;

        }
    );

});


/* =========================
   GET POSITION
========================= */

function getPosition(event) {

    const rect =
    canvas.getBoundingClientRect();

    return {

        x:
        (event.clientX - rect.left)
        *
        (canvas.width / rect.width),

        y:
        (event.clientY - rect.top)
        *
        (canvas.height / rect.height)

    };
}


/* =========================
   POINTER DOWN
========================= */

canvas.addEventListener(
"pointerdown",
event => {

    if(currentTool === "select") {
        return;
    }

    if(currentTool === "emoji") {
        return;
    }

    event.preventDefault();

    drawing = true;

    canvas.setPointerCapture(
        event.pointerId
    );

    const pos =
    getPosition(event);

    startX = pos.x;
    startY = pos.y;

    lastX = pos.x;
    lastY = pos.y;

    savedImage =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

});


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
"pointermove",
event => {

    if(!drawing) return;

    event.preventDefault();

    const pos =
    getPosition(event);


    /* PENCIL */

    if(currentTool === "pencil") {

        ctx.beginPath();

        ctx.moveTo(lastX,lastY);

        ctx.lineTo(pos.x,pos.y);

        ctx.lineWidth =
        Number(sizeSlider.value);

        ctx.strokeStyle =
        colorPicker.value;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.globalAlpha = 1;

        ctx.stroke();

        lastX = pos.x;
        lastY = pos.y;

        return;
    }


    /* BRUSH */

    if(currentTool === "brush") {

        ctx.beginPath();

        ctx.moveTo(lastX,lastY);

        ctx.lineTo(pos.x,pos.y);

        ctx.lineWidth =
        Number(sizeSlider.value) * 2;

        ctx.strokeStyle =
        colorPicker.value;

        ctx.globalAlpha = .55;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.stroke();

        ctx.globalAlpha = 1;

        lastX = pos.x;
        lastY = pos.y;

        return;
    }


    /* ERASER */

    if(currentTool === "eraser") {

        ctx.save();

        ctx.globalCompositeOperation =
        "destination-out";

        ctx.beginPath();

        ctx.moveTo(lastX,lastY);

        ctx.lineTo(pos.x,pos.y);

        ctx.lineWidth =
        Number(sizeSlider.value) * 2;

        ctx.lineCap = "round";

        ctx.stroke();

        ctx.restore();

        lastX = pos.x;
        lastY = pos.y;

        return;
    }


    drawShape(
        pos.x,
        pos.y
    );

});


/* =========================
   POINTER UP
========================= */

function stopDrawing() {

    if(!drawing) return;

    drawing = false;

    saveHistory();
}

canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);


/* =========================
   DRAW SHAPE
========================= */

function drawShape(x,y) {

    ctx.putImageData(
        savedImage,
        0,
        0
    );

    ctx.beginPath();

    ctx.strokeStyle =
    colorPicker.value;

    ctx.lineWidth =
    Number(sizeSlider.value);

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    const w =
    x - startX;

    const h =
    y - startY;


    /* LINE */

    if(currentTool === "line") {

        ctx.moveTo(startX,startY);

        ctx.lineTo(x,y);

        ctx.stroke();
    }


    /* RECTANGLE */

    if(currentTool === "rectangle") {

        ctx.strokeRect(
            startX,
            startY,
            w,
            h
        );
    }


    /* SQUARE */

    if(currentTool === "square") {

        const size =
        Math.max(
            Math.abs(w),
            Math.abs(h)
        );

        ctx.strokeRect(
            startX,
            startY,
            w < 0 ? -size : size,
            h < 0 ? -size : size
        );
    }


    /* CIRCLE */

    if(currentTool === "circle") {

        const radius =
        Math.sqrt(
            w*w + h*h
        );

        ctx.arc(
            startX,
            startY,
            radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }


    /* TRIANGLE */

    if(currentTool === "triangle") {

        ctx.moveTo(
            startX + w/2,
            startY
        );

        ctx.lineTo(
            startX,
            startY + h
        );

        ctx.lineTo(
            startX + w,
            startY + h
        );

        ctx.closePath();

        ctx.stroke();
    }


    /* STAR */

    if(currentTool === "star") {

        const cx =
        startX + w/2;

        const cy =
        startY + h/2;

        const radius =
        Math.max(
            Math.abs(w),
            Math.abs(h)
        ) / 2;

        drawStar(
            cx,
            cy,
            radius
        );

        ctx.stroke();
    }


    /* ARROW */

    if(currentTool === "arrow") {

        drawArrow(
            startX,
            startY,
            x,
            y
        );
    }

}


/* =========================
   STAR
========================= */

function drawStar(
cx,
cy,
radius
) {

    const inner =
    radius * .45;

    for(
        let i=0;
        i<10;
        i++
    ) {

        const angle =
        -Math.PI/2 +
        i*Math.PI/5;

        const r =
        i%2===0
        ? radius
        : inner;

        const x =
        cx +
        Math.cos(angle)*r;

        const y =
        cy +
        Math.sin(angle)*r;

        if(i===0) {

            ctx.moveTo(x,y);

        } else {

            ctx.lineTo(x,y);
        }

    }

    ctx.closePath();
}


/* =========================
   ARROW
========================= */

function drawArrow(
x1,y1,
x2,y2
) {

    const angle =
    Math.atan2(
        y2-y1,
        x2-x1
    );

    const head = 18;

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.moveTo(x2,y2);

    ctx.lineTo(
        x2 -
        head *
        Math.cos(
            angle -
            Math.PI/6
        ),

        y2 -
        head *
        Math.sin(
            angle -
            Math.PI/6
        )
    );

    ctx.moveTo(x2,y2);

    ctx.lineTo(
        x2 -
        head *
        Math.cos(
            angle +
            Math.PI/6
        ),

        y2 -
        head *
        Math.sin(
            angle +
            Math.PI/6
        )
    );

    ctx.stroke();
}


/* =========================
   EMOJIS
========================= */

const emojis = [

"😀","😃","😄","😁","😆",
"😂","🤣","😊","😍","🥰",
"😎","🤩","🥳","😭","😡",

"👍","👏","🙌","💪","🙏",

"❤️","💙","💜","💚","💛",

"🔥","✨","⭐","🌈","☀️",

"🌙","🌸","🌹","🍀",

"🐶","🐱","🦋","🐦",

"🚀","🎈","🎉","🎂",

"🍕","🍔","⚽","🏆",

"🎮","📚","✏️"

];


emojis.forEach(emoji => {

    const button =
    document.createElement("button");

    button.className =
    "emoji";

    button.textContent =
    emoji;

    button.onclick = () => {

        addEmoji(emoji);
    };

    emojiPanel.appendChild(button);

});


function toggleEmojiPanel() {

    emojiPanel
    .classList
    .toggle("show");
}


/* =========================
   ADD EMOJI
========================= */

function addEmoji(emoji) {

    const element =
    document.createElement("div");

    element.className =
    "emoji-object";

    element.textContent =
    emoji;

    element.style.left =
    "50%";

    element.style.top =
    "50%";

    board.appendChild(element);


    let dragging =
    false;

    let offsetX = 0;
    let offsetY = 0;


    element.addEventListener(
    "pointerdown",
    event => {

        if(currentTool !== "select") {

            return;
        }

        event.preventDefault();

        event.stopPropagation();

        selectedObject =
        element;

        document
        .querySelectorAll(
            ".emoji-object"
        )
        .forEach(
            e =>
            e.classList.remove(
                "selected"
            )
        );

        element
        .classList
        .add("selected");

        dragging = true;

        element.setPointerCapture(
            event.pointerId
        );

        const rect =
        element.getBoundingClientRect();

        offsetX =
        event.clientX -
        rect.left;

        offsetY =
        event.clientY -
        rect.top;

        showSelectionMenu(
            element
        );

    });


    element.addEventListener(
    "pointermove",
    event => {

        if(!dragging) return;

        const boardRect =
        board.getBoundingClientRect();

        const x =
        event.clientX -
        boardRect.left -
        offsetX;

        const y =
        event.clientY -
        boardRect.top -
        offsetY;

        element.style.left =
        x + "px";

        element.style.top =
        y + "px";

        element.style.transform =
        "none";

    });


    element.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        saveHistory();
    });

}


/* =========================
   SELECTION MENU
========================= */

function showSelectionMenu(element) {

    const rect =
    element.getBoundingClientRect();

    const boardRect =
    board.getBoundingClientRect();

    selectionMenu.style.display =
    "block";

    selectionMenu.style.left =
    rect.left -
    boardRect.left +
    "px";

    selectionMenu.style.top =
    rect.top -
    boardRect.top -
    45 +
    "px";
}


function deleteSelected() {

    if(selectedObject) {

        selectedObject.remove();

        selectedObject = null;

        selectionMenu.style.display =
        "none";
    }
}


/* =========================
   HISTORY
========================= */

function saveHistory() {

    const data =
    canvas.toDataURL();

    history.push(data);

    if(history.length > 30) {

        history.shift();
    }

    redoHistory = [];

    localStorage.setItem(
        "coolboard-data",
        data
    );
}


function undo() {

    if(history.length < 2) return;

    redoHistory.push(
        history.pop()
    );

    restoreImage(
        history[
            history.length-1
        ]
    );
}


function redo() {

    if(
        redoHistory.length === 0
    ) return;

    const image =
    redoHistory.pop();

    history.push(image);

    restoreImage(image);
}


function restoreImage(data) {

    const image =
    new Image();

    image.onload = () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );
    };

    image.src = data;
}


/* =========================
   CLEAR
========================= */

function clearBoard() {

    if(
        !confirm(
            "বোর্ডের সব কিছু মুছে ফেলতে চাও?"
        )
    ) {
        return;
    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    document
    .querySelectorAll(
        ".emoji-object"
    )
    .forEach(
        e => e.remove()
    );

    saveHistory();
}


/* =========================
   BOARD COLOR
========================= */

boardColor.addEventListener(
"input",
() => {

    board.style.background =
    boardColor.value;

});


/* =========================
   EXPORT PNG
========================= */

function exportBoard() {

    const exportCanvas =
    document.createElement("canvas");

    exportCanvas.width =
    canvas.width;

    exportCanvas.height =
    canvas.height;

    const exportCtx =
    exportCanvas.getContext("2d");

    exportCtx.fillStyle =
    boardColor.value;

    exportCtx.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
    );

    exportCtx.drawImage(
        canvas,
        0,
        0
    );

    const link =
    document.createElement("a");

    link.download =
    "coolboard.png";

    link.href =
    exportCanvas.toDataURL(
        "image/png"
    );

    link.click();
}


/* =========================
   MODE
========================= */

function setMode(
mode,
button
) {

    document
    .querySelectorAll(
        ".mode-btn"
    )
    .forEach(
        btn =>
        btn.classList.remove(
            "active"
        )
    );

    button
    .classList
    .add("active");


    const advanced =
    document.querySelectorAll(
        ".advanced-only"
    );


    if(mode === "advanced") {

        advanced.forEach(
            section =>
            section.style.display =
            "block"
        );

        document
        .getElementById(
            "modeStatus"
        )
        .textContent =
        "🚀 Advanced Mode";

    }

    else {

        advanced.forEach(
            section =>
            section.style.display =
            "none"
        );

        document
        .getElementById(
            "modeStatus"
        )
        .textContent =
        "👶 Kids Mode";
    }
}


/* =========================
   MOBILE SIDEBAR
========================= */

function toggleSidebar() {

    document
    .getElementById("sidebar")
    .classList
    .toggle("open");
}


/* =========================
   LOAD SAVED DRAWING
========================= */

window.addEventListener(
"load",
() => {

    const saved =
    localStorage.getItem(
        "coolboard-data"
    );

    if(saved) {

        restoreImage(saved);

        history.push(saved);
    }

});


/* =========================
   INITIAL HISTORY
========================= */

setTimeout(
() => {

    if(history.length === 0) {

        saveHistory();
    }

},
500
);

</script>
