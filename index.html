<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CoolBoard Studio</title>

<style>
:root{
    --bg:#080b18;
    --panel:#11172a;
    --panel2:#181f36;
    --border:rgba(255,255,255,.10);
    --text:#eef2ff;
    --muted:#9aa4c7;
    --accent:#7c5cff;
    --accent2:#23b7ff;
    --board:#f0f1f3;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(124,92,255,.18),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(35,183,255,.12),transparent 30%),
        var(--bg);
    color:var(--text);
}

/* APP */

.app{
    width:100%;
    height:100%;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    height:100vh;
    overflow-y:auto;
    background:rgba(15,20,38,.96);
    border-right:1px solid var(--border);
    padding:16px;
    position:relative;
    z-index:20;
}

.sidebar::-webkit-scrollbar{
    width:5px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:#596080;
    border-radius:20px;
}

/* LOGO */

.logo{
    padding:10px 4px 18px;
}

.logo h1{
    margin:0;
    font-size:20px;
    letter-spacing:.4px;
}

.logo p{
    margin:5px 0 0;
    font-size:12px;
    color:var(--muted);
}

/* MODE */

.mode-switch{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.mode-btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:11px;
    cursor:pointer;
    color:white;
    background:#202843;
    font-size:13px;
    transition:.25s;
}

.mode-btn.active{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 5px 20px rgba(124,92,255,.25);
}

/* TOOL SECTIONS */

.section{
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
    margin-bottom:12px;
}

.section-title{
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* TOOL GRID */

.tool-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.tool{
    border:1px solid transparent;
    background:#1b223a;
    color:white;
    border-radius:12px;
    min-height:58px;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.tool:hover,
.tool.active{
    border-color:var(--accent);
    background:#252e50;
}

.tool span{
    display:block;
    font-size:21px;
    margin-bottom:4px;
}

/* CONTROLS */

.control-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.control-row label{
    font-size:12px;
    color:var(--muted);
    width:70px;
}

input[type="range"]{
    width:100%;
    accent-color:var(--accent);
}

input[type="color"]{
    width:42px;
    height:32px;
    border:none;
    background:none;
    cursor:pointer;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.action-btn{
    border:none;
    border-radius:11px;
    padding:11px 8px;
    background:#202843;
    color:white;
    cursor:pointer;
    font-size:12px;
}

.action-btn:hover{
    background:#2b3559;
}

.danger{
    background:#4b2435;
}

/* EMOJI */

.emoji-panel{
    display:none;
    margin-top:10px;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    max-height:180px;
    overflow-y:auto;
}

.emoji-panel.show{
    display:grid;
}

.emoji{
    background:#202843;
    border:none;
    border-radius:8px;
    cursor:pointer;
    padding:7px 2px;
    font-size:19px;
}

/* MAIN */

.main{
    flex:1;
    height:100vh;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */

.topbar{
    height:62px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(10,14,29,.82);
    border-bottom:1px solid var(--border);
}

.status{
    font-size:13px;
    color:var(--muted);
}

.status strong{
    color:#dcd8ff;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:11px;
    background:#1d2540;
    color:white;
    font-size:17px;
    cursor:pointer;
}

/* BOARD AREA */

.board-area{
    flex:1;
    padding:16px;
    overflow:auto;
    position:relative;
}

.board-wrapper{
    width:100%;
    height:100%;
    min-height:450px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.board-container{
    position:relative;
    width:min(100%,1100px);
    height:min(100%,720px);
    min-height:420px;

    background:var(--board);
    border-radius:18px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 0 0 1px rgba(0,0,0,.08);

    overflow:hidden;

    touch-action:none;

    transform-origin:center;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

/* EMOJI OBJECT */

.emoji-object{
    position:absolute;
    font-size:40px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    z-index:5;
}

.emoji-object.selected{
    outline:2px dashed #6c5cff;
    outline-offset:5px;
    border-radius:8px;
}

/* SELECTION BOX */

.selection-box{
    position:absolute;
    border:2px dashed #6c5cff;
    pointer-events:none;
    display:none;
    z-index:10;
}

.selection-menu{
    position:absolute;
    display:none;
    z-index:30;

    background:#171d33;
    border:1px solid rgba(255,255,255,.12);

    padding:6px;
    border-radius:10px;

    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.selection-menu button{
    border:none;
    background:#283252;
    color:white;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
    margin:2px;
}

/* MOBILE MENU */

.mobile-tools{
    display:none;
}

/* ANIMATION */

.glow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(124,92,255,.08);
    filter:blur(70px);
    pointer-events:none;
    animation:floatGlow 8s ease-in-out infinite;
}

@keyframes floatGlow{
    0%,100%{
        transform:translate(-20px,-20px);
    }

    50%{
        transform:translate(70px,50px);
    }
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:0;
        bottom:0;
        top:auto;

        width:100%;
        height:auto;
        max-height:62vh;

        border-right:none;
        border-top:1px solid var(--border);

        border-radius:20px 20px 0 0;

        transform:translateY(calc(100% - 58px));
        transition:.35s;

        padding-top:10px;
    }

    .sidebar.open{
        transform:translateY(0);
    }

    .mobile-tools{
        display:block;
        text-align:center;
        padding:8px;
        color:#b9c1e6;
        font-size:13px;
    }

    .logo{
        display:none;
    }

    .main{
        width:100%;
    }

    .board-area{
        padding:8px;
    }

    .board-container{
        min-height:350px;
        border-radius:12px;
    }

    .tool-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .tool{
        min-height:52px;
        font-size:10px;
    }

    .topbar{
        height:55px;
    }
}

</style>

</head>

<body>

<div class="glow"></div>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

<div class="mobile-tools" onclick="toggleSidebar()">
    ⬆ Tools Panel
</div>

<div class="logo">
    <h1>✨ CoolBoard Studio</h1>
    <p>Draw • Learn • Create</p>
</div>

<!-- MODE -->

<div class="mode-switch">

<button class="mode-btn active" onclick="setMode('kids',this)">
👶 Kids
</button>

<button class="mode-btn" onclick="setMode('advanced',this)">
🚀 Advanced
</button>

</div>

<!-- COMMON -->

<div class="section">

<div class="section-title">
Basic Tools
</div>

<div class="tool-grid">

<button class="tool active" data-tool="pencil">
<span>✏️</span>Pencil
</button>

<button class="tool" data-tool="brush">
<span>🖌️</span>Brush
</button>

<button class="tool" data-tool="eraser">
<span>🧽</span>Eraser
</button>

<button class="tool" data-tool="select">
<span>🎯</span>Select
</button>

<button class="tool" data-tool="emoji">
<span>😀</span>Emoji
</button>

<button class="tool" data-tool="line">
<span>➖</span>Line
</button>

</div>

</div>

<!-- DRAWING SETTINGS -->

<div class="section">

<div class="section-title">
Drawing Settings
</div>

<div class="control-row">

<label>Color</label>

<input
type="color"
id="colorPicker"
value="#222222"

>

</div>

<div class="control-row">

<label>Size</label>

<input
type="range"
id="sizeSlider"
min="1"
max="50"
value="5"

>

</div>

</div>

<!-- EMOJI -->

<div class="section">

<button
class="action-btn"
style="width:100%"
onclick="toggleEmojiPanel()"

>

😀 Add Emoji </button>

<div class="emoji-panel" id="emojiPanel"></div>

</div>

<!-- ADVANCED -->

<div class="section advanced-only" style="display:none">

<div class="section-title">
Shapes
</div>

<div class="tool-grid">

<button class="tool" data-tool="circle">
<span>⭕</span>Circle
</button>

<button class="tool" data-tool="rectangle">
<span>▭</span>Rectangle
</button>

<button class="tool" data-tool="triangle">
<span>🔺</span>Triangle
</button>

<button class="tool" data-tool="star">
<span>⭐</span>Star
</button>

<button class="tool" data-tool="arrow">
<span>➡️</span>Arrow
</button>

<button class="tool" data-tool="square">
<span>⬜</span>Square
</button>

</div>

</div>

<!-- BOARD -->

<div class="section">

<div class="section-title">
Board Settings
</div>

<div class="control-row">

<label>Board</label>

<input
type="color"
id="boardColor"
value="#f0f1f3"

>

</div>

</div>

<!-- ACTIONS -->

<div class="section">

<div class="section-title">
Actions
</div>

<div class="actions">

<button class="action-btn" onclick="undo()">
↩ Undo
</button>

<button class="action-btn" onclick="redo()">
↪ Redo
</button>

<button class="action-btn" onclick="zoomBoard(1.1)">
➕ Zoom
</button>

<button class="action-btn" onclick="zoomBoard(.9)">
➖ Zoom
</button>

<button class="action-btn" onclick="exportBoard()">
🖼 Save
</button>

<button class="action-btn danger" onclick="clearBoard()">
🗑 Clear
</button>

</div>

</div>

</aside>

<!-- MAIN -->

<main class="main">

<header class="topbar">

<div class="status">

<strong id="modeStatus">
👶 Kids Mode
</strong>

<span id="toolStatus">
• Pencil
</span>

</div>

<div class="top-actions">

<button
class="icon-btn"
onclick="toggleSidebar()"

>

🛠 </button>

<button
class="icon-btn"
onclick="resetZoom()"

>

🎯 </button>

</div>

</header>

<div class="board-area">

<div class="board-wrapper">

<div class="board-container" id="board">

<canvas id="canvas"></canvas>

<div class="selection-box" id="selectionBox"></div>

<div class="selection-menu" id="selectionMenu">

<button onclick="moveSelected()">
✋ Move
</button>

<button onclick="deleteSelected()">
🗑 Delete
</button>

</div>

</div>

</div>

</div>

</main>

</div>

<script>

/* =========================
ELEMENTS
========================= */

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const board = document.getElementById("board");

const colorPicker = document.getElementById("colorPicker");

const sizeSlider = document.getElementById("sizeSlider");

const boardColor = document.getElementById("boardColor");

const emojiPanel = document.getElementById("emojiPanel");

const selectionBox = document.getElementById("selectionBox");

const selectionMenu = document.getElementById("selectionMenu");


/* =========================
STATE
========================= */

let currentTool = "pencil";

let drawing = false;

let startX = 0;

let startY = 0;

let lastX = 0;

let lastY = 0;

let savedImage = null;

let history = [];

let redoHistory = [];

let selectedEmoji = null;

let movingEmoji = false;

let zoom = 1;

let currentMode = "kids";


/* =========================
CANVAS SIZE
========================= */

function resizeCanvas(){

    const oldImage = canvas.toDataURL();

    canvas.width = board.clientWidth;

    canvas.height = board.clientHeight;

    if(oldImage){

        const image = new Image();

        image.onload = () => {

            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );

        };

        image.src = oldImage;

    }

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


/* =========================
EMOJIS
========================= */

const emojis = [

"😀","😃","😄","😁","😆","🥹",
"😂","🤣","😊","😍","🥰","😘",
"😎","🤩","🥳","😴","🤔","😱",
"😭","😡","🤯","🤗","😇","🥺",
"👍","👎","👏","🙌","💪","🙏",
"❤️","💙","💜","💚","💛","🖤",
"🔥","✨","⭐","🌈","☀️","🌙",
"🌸","🌹","🌳","🍀","🐶","🐱",
"🦋","🐦","🚀","🎈","🎉","🎂",
"🍕","🍔","🍎","⚽","🏆","🎮"

];


emojis.forEach(emoji=>{

    const button = document.createElement("button");

    button.className = "emoji";

    button.textContent = emoji;

    button.onclick = () => {

        addEmoji(emoji);

    };

    emojiPanel.appendChild(button);

});


function toggleEmojiPanel(){

    emojiPanel.classList.toggle("show");

}


/* =========================
ADD EMOJI
========================= */

function addEmoji(emoji){

    const element = document.createElement("div");

    element.className = "emoji-object";

    element.textContent = emoji;

    element.style.left = "50%";

    element.style.top = "50%";

    element.style.transform =
    "translate(-50%,-50%)";

    board.appendChild(element);


    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    element.addEventListener(
    "pointerdown",
    event=>{

        if(currentTool !== "select") return;

        selectedEmoji = element;

        document
        .querySelectorAll(".emoji-object")
        .forEach(e=>e.classList.remove("selected"));

        element.classList.add("selected");

        dragging = true;

        element.setPointerCapture(event.pointerId);

        const rect = element.getBoundingClientRect();

        offsetX = event.clientX - rect.left;

        offsetY = event.clientY - rect.top;

        event.stopPropagation();

        showSelectionMenu(element);

    });


    element.addEventListener(
    "pointermove",
    event=>{

        if(!dragging) return;

        const rect = board.getBoundingClientRect();

        let x =
        event.clientX -
        rect.left -
        offsetX;

        let y =
        event.clientY -
        rect.top -
        offsetY;


        element.style.left =
        x + "px";

        element.style.top =
        y + "px";

        element.style.transform =
        "none";

    });


    element.addEventListener(
    "pointerup",
    ()=>{

        dragging = false;

    });


    saveHistory();

}


/* =========================
SELECTION MENU
========================= */

function showSelectionMenu(element){

    const rect =
    element.getBoundingClientRect();

    const boardRect =
    board.getBoundingClientRect();


    selectionMenu.style.display = "block";

    selectionMenu.style.left =
    rect.left -
    boardRect.left +
    "px";

    selectionMenu.style.top =
    rect.top -
    boardRect.top -
    48 +
    "px";

}


function moveSelected(){

    if(selectedEmoji){

        selectedEmoji.style.cursor =
        "grab";

    }

}


function deleteSelected(){

    if(selectedEmoji){

        selectedEmoji.remove();

        selectedEmoji = null;

        selectionMenu.style.display =
        "none";

        saveHistory();

    }

}


/* =========================
TOOLS
========================= */

document
.querySelectorAll(".tool")
.forEach(button=>{

    button.addEventListener(
    "click",
    ()=>{

        document
        .querySelectorAll(".tool")
        .forEach(b=>b.classList.remove("active"));

        button.classList.add("active");

        currentTool =
        button.dataset.tool;

        document
        .getElementById("toolStatus")
        .textContent =
        "• " +
        button.innerText
        .replace(/\n/g," ");

    });

});


/* =========================
COORDINATES
========================= */

function getPosition(event){

    const rect =
    canvas.getBoundingClientRect();

    return {

        x:
        (event.clientX - rect.left)
        *
        (
            canvas.width /
            rect.width
        ),

        y:
        (event.clientY - rect.top)
        *
        (
            canvas.height /
            rect.height
        )

    };

}


/* =========================
POINTER START
========================= */

canvas.addEventListener(
"pointerdown",
event=>{

    if(currentTool === "select")
    return;


    drawing = true;

    canvas.setPointerCapture(
    event.pointerId
    );


    const pos =
    getPosition(event);


    startX = pos.x;

    startY = pos.y;

    lastX = pos.x;

    lastY = pos.y;


    savedImage =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

});


/* =========================
POINTER MOVE
========================= */

canvas.addEventListener(
"pointermove",
event=>{

    if(!drawing)
    return;


    const pos =
    getPosition(event);


    if(

        currentTool === "pencil" ||

        currentTool === "brush" ||

        currentTool === "eraser"

    ){

        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );


        ctx.lineCap =
        "round";

        ctx.lineJoin =
        "round";


        if(
        currentTool === "pencil"
        ){

            ctx.globalCompositeOperation =
            "source-over";

            ctx.strokeStyle =
            colorPicker.value;

            ctx.lineWidth =
            Number(sizeSlider.value);

            ctx.globalAlpha = 1;

        }


        if(
        currentTool === "brush"
        ){

            ctx.globalCompositeOperation =
            "source-over";

            ctx.strokeStyle =
            colorPicker.value;

            ctx.lineWidth =
            Number(sizeSlider.value) * 2.3;

            ctx.globalAlpha =
            .55;

        }


        if(
        currentTool === "eraser"
        ){

            ctx.globalCompositeOperation =
            "destination-out";

            ctx.lineWidth =
            Number(sizeSlider.value) * 2;

            ctx.globalAlpha =
            1;

        }


        ctx.stroke();

        ctx.globalAlpha = 1;

        ctx.globalCompositeOperation =
        "source-over";


        lastX = pos.x;

        lastY = pos.y;

        return;

    }


    drawPreview(
        pos.x,
        pos.y
    );


});


/* =========================
POINTER END
========================= */

canvas.addEventListener(
"pointerup",
()=>{

    if(!drawing)
    return;


    drawing = false;

    saveHistory();

});


/* =========================
DRAW PREVIEW
========================= */

function drawPreview(x,y){

    ctx.putImageData(
        savedImage,
        0,
        0
    );


    ctx.strokeStyle =
    colorPicker.value;

    ctx.fillStyle =
    colorPicker.value;

    ctx.lineWidth =
    Number(sizeSlider.value);

    ctx.globalAlpha = 1;


    const width =
    x - startX;

    const height =
    y - startY;


    ctx.beginPath();


    /* LINE */

    if(
    currentTool === "line"
    ){

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

    }


    /* RECTANGLE */

    else if(
    currentTool === "rectangle"
    ){

        ctx.strokeRect(
            startX,
            startY,
            width,
            height
        );

    }


    /* SQUARE */

    else if(
    currentTool === "square"
    ){

        const size =
        Math.max(
            Math.abs(width),
            Math.abs(height)
        );

        const directionX =
        width < 0 ? -1 : 1;

        const directionY =
        height < 0 ? -1 : 1;


        ctx.strokeRect(

            startX,

            startY,

            size * directionX,

            size * directionY

        );

    }


    /* CIRCLE */

    else if(
    currentTool === "circle"
    ){

        const radius =
        Math.sqrt(

            width * width +

            height * height

        );


        ctx.arc(

            startX,

            startY,

            radius,

            0,

            Math.PI * 2

        );


        ctx.stroke();

    }


    /* TRIANGLE */

    else if(
    currentTool === "triangle"
    ){

        ctx.moveTo(
            startX + width / 2,
            startY
        );

        ctx.lineTo(
            startX,
            startY + height
        );

        ctx.lineTo(
            startX + width,
            startY + height
        );

        ctx.closePath();

        ctx.stroke();

    }


    /* STAR */

    else if(
    currentTool === "star"
    ){

        drawStar(

            startX + width / 2,

            startY + height / 2,

            Math.max(
                Math.abs(width),
                Math.abs(height)
            ) / 2

        );

        ctx.stroke();

    }


    /* ARROW */

    else if(
    currentTool === "arrow"
    ){

        drawArrow(

            startX,

            startY,

            x,

            y

        );

    }

}


/* =========================
STAR
========================= */

function drawStar(cx,cy,radius){

    const inner =
    radius * .45;


    for(

        let i = 0;

        i < 10;

        i++

    ){

        const angle =

        -Math.PI / 2

        +

        i * Math.PI / 5;


        const r =

        i % 2 === 0

        ?

        radius

        :

        inner;


        const x =

        cx +

        Math.cos(angle) * r;


        const y =

        cy +

        Math.sin(angle) * r;


        if(i === 0){

            ctx.moveTo(x,y);

        }

        else{

            ctx.lineTo(x,y);

        }

    }


    ctx.closePath();

}


/* =========================
ARROW
========================= */

function drawArrow(x1,y1,x2,y2){

    const angle =

    Math.atan2(

        y2 - y1,

        x2 - x1

    );


    const head = 18;


    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);


    ctx.lineTo(

        x2 -

        head *

        Math.cos(
            angle -
            Math.PI / 6
        ),

        y2 -

        head *

        Math.sin(
            angle -
            Math.PI / 6
        )

    );


    ctx.moveTo(x2,y2);


    ctx.lineTo(

        x2 -

        head *

        Math.cos(
            angle +
            Math.PI / 6
        ),

        y2 -

        head *

        Math.sin(
            angle +
            Math.PI / 6
        )

    );


    ctx.stroke();

}


/* =========================
UNDO REDO
========================= */

function saveHistory(){

    const data =
    canvas.toDataURL();

    history.push(data);


    if(history.length > 30){

        history.shift();

    }


    redoHistory = [];


    localStorage.setItem(
        "coolboard",
        data
    );

}


function undo(){

    if(history.length < 2)
    return;


    redoHistory.push(
        history.pop()
    );


    restoreImage(

        history[
            history.length - 1
        ]

    );

}


function redo(){

    if(
    redoHistory.length === 0
    )
    return;


    const image =
    redoHistory.pop();


    history.push(image);


    restoreImage(image);

}


function restoreImage(data){

    const image =
    new Image();


    image.onload =
    ()=>{

        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        ctx.drawImage(

            image,

            0,

            0,

            canvas.width,

            canvas.height

        );

    };


    image.src = data;

}


/* =========================
CLEAR
========================= */

function clearBoard(){

    const confirmClear =
    confirm(
        "Clear the entire drawing?"
    );


    if(!confirmClear)
    return;


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    document
    .querySelectorAll(
        ".emoji-object"
    )
    .forEach(
        emoji=>emoji.remove()
    );


    saveHistory();

}


/* =========================
BOARD COLOR
========================= */

boardColor.addEventListener(
"input",
()=>{

    board.style.background =
    boardColor.value;

});


/* =========================
ZOOM
========================= */

function zoomBoard(value){

    zoom *= value;


    zoom =
    Math.min(

        Math.max(
            zoom,
            .6
        ),

        1.8

    );


    board.style.transform =
    `scale(${zoom})`;

}


function resetZoom(){

    zoom = 1;

    board.style.transform =
    "scale(1)";

}


/* =========================
EXPORT
========================= */

function exportBoard(){

    const exportCanvas =
    document.createElement(
        "canvas"
    );


    exportCanvas.width =
    canvas.width;

    exportCanvas.height =
    canvas.height;


    const exportCtx =
    exportCanvas.getContext("2d");


    exportCtx.fillStyle =
    boardColor.value;

    exportCtx.fillRect(

        0,

        0,

        exportCanvas.width,

        exportCanvas.height

    );


    exportCtx.drawImage(
        canvas,
        0,
        0
    );


    const link =
    document.createElement("a");


    link.download =
    "coolboard.png";


    link.href =
    exportCanvas.toDataURL(
        "image/png"
    );


    link.click();

}


/* =========================
MODE
========================= */

function setMode(mode,button){

    currentMode = mode;


    document
    .querySelectorAll(".mode-btn")
    .forEach(
        btn=>btn.classList.remove(
            "active"
        )
    );


    button.classList.add(
        "active"
    );


    const advanced =
    document.querySelectorAll(
        ".advanced-only"
    );


    if(
    mode === "advanced"
    ){

        advanced.forEach(
            section=>
            section.style.display =
            "block"
        );


        document
        .getElementById(
            "modeStatus"
        )
        .textContent =
        "🚀 Advanced Mode";

    }

    else{

        advanced.forEach(
            section=>
            section.style.display =
            "none"
        );


        document
        .getElementById(
            "modeStatus"
        )
        .textContent =
        "👶 Kids Mode";

    }

}


/* =========================
SIDEBAR
========================= */

function toggleSidebar(){

    document
    .getElementById(
        "sidebar"
    )
    .classList.toggle(
        "open"
    );

}


/* =========================
LOAD SAVE
========================= */

window.addEventListener(
"load",
()=>{

    const saved =
    localStorage.getItem(
        "coolboard"
    );


    if(saved){

        restoreImage(saved);

        history.push(saved);

    }

});

</script>
