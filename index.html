<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">

<title>CoolBoard Studio</title>

<style>

/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b16;
    font-family:Arial,sans-serif;
}

/* ================================
   APP
================================ */

.app{
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    background:
    radial-gradient(circle at top,
    #182550 0%,
    #0a0e1d 55%);
}

/* ================================
   HEADER
================================ */

.header{
    height:50px;
    min-height:50px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:
    rgba(10,14,30,.95);

    border-bottom:
    1px solid rgba(255,255,255,.08);
}

.logo{
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.logo span{
    color:#8b74ff;
}

.mode-switch{
    display:flex;
    gap:5px;
}

.mode-btn{

    border:none;

    padding:7px 9px;

    border-radius:9px;

    background:#20294a;

    color:#d9e0ff;

    font-size:10px;

    cursor:pointer;
}

.mode-btn.active{

    background:
    linear-gradient(
    135deg,
    #745cff,
    #2caeff);

    color:white;
}

/* ================================
   BOARD AREA
================================ */

.board-area{

    flex:1;

    min-height:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:7px;

    overflow:hidden;
}

/* ================================
   BOARD
================================ */

.board{

    width:100%;

    height:100%;

    max-width:1100px;

    position:relative;

    overflow:hidden;

    background:#e6e7eb;

    border-radius:13px;

    box-shadow:
    0 10px 35px
    rgba(0,0,0,.35);

    touch-action:none;
}

canvas{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    touch-action:none;
}

/* ================================
   TOOLBAR
================================ */

.toolbar{

    min-height:205px;

    max-height:205px;

    padding:7px;

    background:
    linear-gradient(
    180deg,
    #151c35,
    #0c1124);

    border-top:
    1px solid
    rgba(255,255,255,.08);

    display:flex;

    flex-direction:column;

    gap:6px;

    overflow:hidden;
}

/* ================================
   TOOL ROW
================================ */

.tool-row{

    display:flex;

    gap:5px;

    overflow-x:auto;

    padding-bottom:2px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.tool-row::-webkit-scrollbar{
    display:none;
}

/* ================================
   TOOL BUTTON
================================ */

.tool{

    min-width:52px;

    height:46px;

    border:none;

    border-radius:10px;

    background:#202a4a;

    color:white;

    font-size:8px;

    cursor:pointer;

    flex-shrink:0;

    transition:.2s;
}

.tool span{

    display:block;

    font-size:17px;

    margin-bottom:2px;
}

.tool.active{

    background:
    linear-gradient(
    135deg,
    #745cff,
    #2daeff);

    box-shadow:
    0 0 12px
    rgba(100,90,255,.4);
}

/* ================================
   SETTINGS ROW
================================ */

.settings{

    display:flex;

    align-items:center;

    gap:7px;

    padding:2px 3px;
}

.settings label{

    color:#b5bedc;

    font-size:10px;
}

.settings input[type="range"]{

    flex:1;

    accent-color:#795fff;
}

.settings input[type="color"]{

    width:30px;

    height:28px;

    border:none;

    background:transparent;

    border-radius:7px;
}

/* ================================
   ACTIONS
================================ */

.actions{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:5px;
}

.action{

    height:35px;

    border:none;

    border-radius:8px;

    background:#242e50;

    color:white;

    font-size:9px;

    cursor:pointer;
}

.action:active,
.tool:active{

    transform:scale(.95);
}

/* ================================
   EMOJI PANEL
================================ */

.emoji-panel{

    position:absolute;

    left:8px;

    right:8px;

    bottom:210px;

    z-index:100;

    display:none;

    grid-template-columns:
    repeat(8,1fr);

    gap:5px;

    max-height:170px;

    overflow-y:auto;

    padding:10px;

    border-radius:15px;

    background:#151d36;

    border:
    1px solid
    rgba(255,255,255,.1);

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.4);

    -webkit-overflow-scrolling:touch;
}

.emoji-panel.show{
    display:grid;
}

.emoji{

    border:none;

    background:#242e50;

    border-radius:7px;

    font-size:19px;

    height:38px;

    cursor:pointer;
}

/* ================================
   EMOJI OBJECT
================================ */

.emoji-object{

    position:absolute;

    z-index:10;

    font-size:42px;

    transform:
    translate(-50%,-50%);

    touch-action:none;

    user-select:none;

    cursor:grab;
}

.emoji-object.selected{

    outline:
    2px dashed
    #745cff;

    outline-offset:4px;

    border-radius:7px;
}

/* ================================
   OBJECT MENU
================================ */

.object-menu{

    position:absolute;

    z-index:50;

    display:none;

    gap:5px;

    padding:5px;

    background:#11182e;

    border-radius:10px;

    border:
    1px solid
    rgba(255,255,255,.1);
}

.object-menu button{

    border:none;

    border-radius:6px;

    padding:6px 8px;

    background:#273256;

    color:white;

    font-size:10px;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .header{

        height:45px;

        min-height:45px;

        padding:0 8px;
    }

    .logo{

        font-size:13px;
    }

    .mode-btn{

        padding:6px 7px;

        font-size:9px;
    }

    .board-area{

        padding:5px;
    }

    .board{

        border-radius:10px;
    }

    .toolbar{

        min-height:210px;

        max-height:210px;

        padding:
        5px 6px
        calc(5px + env(safe-area-inset-bottom));
    }

    .tool{

        min-width:48px;

        height:43px;

        font-size:7px;
    }

    .tool span{

        font-size:16px;
    }

    .action{

        height:33px;

        font-size:8px;
    }

    .emoji-panel{

        bottom:215px;

        grid-template-columns:
        repeat(7,1fr);
    }

}

/* ================================
   SMALL MOBILE
================================ */

@media(max-height:700px){

    .toolbar{

        min-height:185px;

        max-height:185px;
    }

    .tool{

        height:40px;
    }

    .emoji-panel{

        bottom:190px;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<div class="header">

<div class="logo">
✨ <span>CoolBoard</span>
</div>

<div class="mode-switch">

<button
class="mode-btn active"
onclick="setMode('kids',this)">
👶 Kids </button>

<button
class="mode-btn"
onclick="setMode('advanced',this)">
🚀 Advanced </button>

</div>

</div>

<!-- ================= BOARD ================= -->

<div class="board-area">

<div
class="board"
id="board">

<canvas id="canvas"></canvas>

<div
class="object-menu"
id="objectMenu">

<button onclick="deleteSelected()">
🗑️
</button>

</div>

</div>

</div>

<!-- ================= EMOJI ================= -->

<div
class="emoji-panel"
id="emojiPanel">
</div>

<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

<!-- ROW 1 -->

<div class="tool-row">

<button
class="tool active"
data-tool="pencil">

<span>✏️</span>
Pencil

</button>

<button
class="tool"
data-tool="brush">

<span>🖌️</span>
Brush

</button>

<button
class="tool"
data-tool="eraser">

<span>🧽</span>
Erase

</button>

<button
class="tool"
data-tool="select">

<span>🎯</span>
Move

</button>

<button
class="tool"
data-tool="emoji">

<span>😀</span>
Emoji

</button>

<button
class="tool advanced"
data-tool="line">

<span>➖</span>
Line

</button>

<button
class="tool advanced"
data-tool="arrow">

<span>➡️</span>
Arrow

</button>

<button
class="tool advanced"
data-tool="circle">

<span>⭕</span>
Circle

</button>

<button
class="tool advanced"
data-tool="rectangle">

<span>▭</span>
Box

</button>

<button
class="tool advanced"
data-tool="triangle">

<span>🔺</span>
Triangle

</button>

<button
class="tool advanced"
data-tool="star">

<span>⭐</span>
Star

</button>

</div>

<!-- SETTINGS -->

<div class="settings">

<label>🎨</label>

<input
type="color"
id="colorPicker"
value="#222222">

<label>📏</label>

<input
type="range"
id="sizeSlider"
min="1"
max="40"
value="5">

<input
type="color"
id="boardColor"
value="#e6e7eb">

</div>

<!-- ACTIONS -->

<div class="actions">

<button
class="action"
onclick="undo()">

↩ Undo

</button>

<button
class="action"
onclick="redo()">

↪ Redo

</button>

<button
class="action"
onclick="exportBoard()">

💾 Save

</button>

<button
class="action"
onclick="clearBoard()">

🗑 Clear

</button>

<button
class="action"
onclick="toggleEmojiPanel()">

😀 Emoji

</button>

</div>

</div>

</div>

<script>

/* =================================
   ELEMENTS
================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const board =
document.getElementById("board");

const colorPicker =
document.getElementById("colorPicker");

const sizeSlider =
document.getElementById("sizeSlider");

const boardColor =
document.getElementById("boardColor");

const emojiPanel =
document.getElementById("emojiPanel");

const objectMenu =
document.getElementById("objectMenu");


/* =================================
   STATE
================================= */

let currentTool =
"pencil";

let drawing =
false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let savedImage =
null;

let history = [];
let redoHistory = [];

let selectedObject =
null;


/* =================================
   RESIZE
================================= */

function resizeCanvas(){

    const oldCanvas =
    document.createElement("canvas");

    oldCanvas.width =
    canvas.width;

    oldCanvas.height =
    canvas.height;

    const oldCtx =
    oldCanvas.getContext("2d");

    oldCtx.drawImage(
        canvas,
        0,
        0
    );


    canvas.width =
    board.clientWidth;

    canvas.height =
    board.clientHeight;


    if(oldCanvas.width > 0){

        ctx.drawImage(
            oldCanvas,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =================================
   TOOL SELECT
================================= */

document
.querySelectorAll(".tool")
.forEach(button => {

    button.addEventListener(
    "click",
    () => {

        currentTool =
        button.dataset.tool;

        document
        .querySelectorAll(".tool")
        .forEach(b =>
        b.classList.remove(
        "active"
        ));

        button
        .classList
        .add("active");


        if(
        currentTool ===
        "emoji"
        ){

            toggleEmojiPanel();

        }

    });

});


/* =================================
   POSITION
================================= */

function getPosition(event){

    const rect =
    canvas.getBoundingClientRect();

    return{

        x:
        (event.clientX - rect.left)
        *
        (canvas.width / rect.width),

        y:
        (event.clientY - rect.top)
        *
        (canvas.height / rect.height)

    };

}


/* =================================
   POINTER DOWN
================================= */

canvas.addEventListener(
"pointerdown",
event => {

    if(
    currentTool ===
    "select"
    ||
    currentTool ===
    "emoji"
    ){

        return;

    }

    event.preventDefault();

    drawing =
    true;

    canvas.setPointerCapture(
    event.pointerId
    );

    const pos =
    getPosition(event);

    startX =
    pos.x;

    startY =
    pos.y;

    lastX =
    pos.x;

    lastY =
    pos.y;

    savedImage =
    ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
    );

});


/* =================================
   POINTER MOVE
================================= */

canvas.addEventListener(
"pointermove",
event => {

    if(!drawing) return;

    event.preventDefault();

    const pos =
    getPosition(event);


    /* PENCIL */

    if(
    currentTool ===
    "pencil"
    ){

        ctx.beginPath();

        ctx.moveTo(
        lastX,
        lastY
        );

        ctx.lineTo(
        pos.x,
        pos.y
        );

        ctx.lineWidth =
        Number(
        sizeSlider.value
        );

        ctx.strokeStyle =
        colorPicker.value;

        ctx.lineCap =
        "round";

        ctx.lineJoin =
        "round";

        ctx.globalAlpha =
        1;

        ctx.stroke();

        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    /* BRUSH */

    if(
    currentTool ===
    "brush"
    ){

        ctx.beginPath();

        ctx.moveTo(
        lastX,
        lastY
        );

        ctx.lineTo(
        pos.x,
        pos.y
        );

        ctx.lineWidth =
        Number(
        sizeSlider.value
        ) * 2;

        ctx.strokeStyle =
        colorPicker.value;

        ctx.globalAlpha =
        .55;

        ctx.lineCap =
        "round";

        ctx.stroke();

        ctx.globalAlpha =
        1;

        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    /* ERASER */

    if(
    currentTool ===
    "eraser"
    ){

        ctx.save();

        ctx.globalCompositeOperation =
        "destination-out";

        ctx.beginPath();

        ctx.moveTo(
        lastX,
        lastY
        );

        ctx.lineTo(
        pos.x,
        pos.y
        );

        ctx.lineWidth =
        Number(
        sizeSlider.value
        ) * 3;

        ctx.lineCap =
        "round";

        ctx.stroke();

        ctx.restore();

        lastX =
        pos.x;

        lastY =
        pos.y;

        return;

    }


    drawShape(
    pos.x,
    pos.y
    );

});


/* =================================
   POINTER UP
================================= */

function stopDrawing(){

    if(!drawing) return;

    drawing =
    false;

    saveHistory();

}

canvas.addEventListener(
"pointerup",
stopDrawing
);

canvas.addEventListener(
"pointercancel",
stopDrawing
);


/* =================================
   SHAPES
================================= */

function drawShape(x,y){

    ctx.putImageData(
    savedImage,
    0,
    0
    );

    ctx.beginPath();

    ctx.strokeStyle =
    colorPicker.value;

    ctx.lineWidth =
    Number(
    sizeSlider.value
    );

    ctx.lineCap =
    "round";

    const w =
    x - startX;

    const h =
    y - startY;


    /* LINE */

    if(
    currentTool ===
    "line"
    ){

        ctx.moveTo(
        startX,
        startY
        );

        ctx.lineTo(
        x,
        y
        );

        ctx.stroke();

    }


    /* RECTANGLE */

    if(
    currentTool ===
    "rectangle"
    ){

        ctx.strokeRect(
        startX,
        startY,
        w,
        h
        );

    }


    /* CIRCLE */

    if(
    currentTool ===
    "circle"
    ){

        const radius =
        Math.sqrt(
        w*w +
        h*h
        );

        ctx.arc(
        startX,
        startY,
        radius,
        0,
        Math.PI * 2
        );

        ctx.stroke();

    }


    /* TRIANGLE */

    if(
    currentTool ===
    "triangle"
    ){

        ctx.moveTo(
        startX + w/2,
        startY
        );

        ctx.lineTo(
        startX,
        startY + h
        );

        ctx.lineTo(
        startX + w,
        startY + h
        );

        ctx.closePath();

        ctx.stroke();

    }


    /* STAR */

    if(
    currentTool ===
    "star"
    ){

        const cx =
        startX +
        w/2;

        const cy =
        startY +
        h/2;

        const radius =
        Math.max(
        Math.abs(w),
        Math.abs(h)
        ) / 2;

        drawStar(
        cx,
        cy,
        radius
        );

        ctx.stroke();

    }


    /* ARROW */

    if(
    currentTool ===
    "arrow"
    ){

        drawArrow(
        startX,
        startY,
        x,
        y
        );

    }

}


/* =================================
   STAR
================================= */

function drawStar(
cx,
cy,
radius
){

    const inner =
    radius*.45;

    for(
    let i=0;
    i<10;
    i++
    ){

        const angle =
        -Math.PI/2 +
        i*Math.PI/5;

        const r =
        i%2===0
        ?
        radius
        :
        inner;

        const x =
        cx +
        Math.cos(angle)*r;

        const y =
        cy +
        Math.sin(angle)*r;

        if(i===0){

            ctx.moveTo(x,y);

        }

        else{

            ctx.lineTo(x,y);

        }

    }

    ctx.closePath();

}


/* =================================
   ARROW
================================= */

function drawArrow(
x1,
y1,
x2,
y2
){

    const angle =
    Math.atan2(
    y2-y1,
    x2-x1
    );

    const head =
    18;

    ctx.moveTo(
    x1,
    y1
    );

    ctx.lineTo(
    x2,
    y2
    );

    ctx.moveTo(
    x2,
    y2
    );

    ctx.lineTo(

    x2 -
    head *
    Math.cos(
    angle -
    Math.PI/6
    ),

    y2 -
    head *
    Math.sin(
    angle -
    Math.PI/6
    )

    );


    ctx.moveTo(
    x2,
    y2
    );

    ctx.lineTo(

    x2 -
    head *
    Math.cos(
    angle +
    Math.PI/6
    ),

    y2 -
    head *
    Math.sin(
    angle +
    Math.PI/6
    )

    );

    ctx.stroke();

}


/* =================================
   EMOJIS
================================= */

const emojis = [

"😀","😃","😄","😁","😂",
"🤣","😊","😍","🥰","😎",
"🤩","🥳","😭","😡","😴",

"👍","👏","🙌","💪","🙏",

"❤️","💙","💜","💚","💛",

"🔥","✨","⭐","🌈","☀️",

"🌙","🌸","🌹","🍀",

"🐶","🐱","🦋","🐦",

"🚀","🎈","🎉","🎂",

"🍕","🍔","⚽","🏆",

"🎮","📚","✏️"

];


emojis.forEach(emoji => {

    const button =
    document.createElement(
    "button"
    );

    button.className =
    "emoji";

    button.textContent =
    emoji;

    button.onclick =
    () => {

        addEmoji(
        emoji
        );

    };

    emojiPanel.appendChild(
    button
    );

});


function toggleEmojiPanel(){

    emojiPanel
    .classList
    .toggle("show");

}


/* =================================
   ADD EMOJI
================================= */

function addEmoji(emoji){

    const element =
    document.createElement(
    "div"
    );

    element.className =
    "emoji-object";

    element.textContent =
    emoji;

    element.style.left =
    "50%";

    element.style.top =
    "50%";

    board.appendChild(
    element
    );


    let dragging =
    false;

    let offsetX =
    0;

    let offsetY =
    0;


    element.addEventListener(
    "pointerdown",
    event => {

        if(
        currentTool !==
        "select"
        ){

            return;

        }

        event.preventDefault();

        event.stopPropagation();

        selectedObject =
        element;

        document
        .querySelectorAll(
        ".emoji-object"
        )
        .forEach(
        e =>
        e.classList.remove(
        "selected"
        )
        );

        element
        .classList
        .add(
        "selected"
        );

        dragging =
        true;

        const rect =
        element.getBoundingClientRect();

        offsetX =
        event.clientX -
        rect.left;

        offsetY =
        event.clientY -
        rect.top;

        showObjectMenu(
        element
        );

    });


    element.addEventListener(
    "pointermove",
    event => {

        if(!dragging)
        return;

        const rect =
        board.getBoundingClientRect();

        element.style.left =
        event.clientX -
        rect.left -
        offsetX +
        "px";

        element.style.top =
        event.clientY -
        rect.top -
        offsetY +
        "px";

        element.style.transform =
        "none";

    });


    element.addEventListener(
    "pointerup",
    () => {

        dragging =
        false;

    });

}


/* =================================
   OBJECT MENU
================================= */

function showObjectMenu(
element
){

    const rect =
    element.getBoundingClientRect();

    const boardRect =
    board.getBoundingClientRect();

    objectMenu.style.display =
    "flex";

    objectMenu.style.left =
    rect.left -
    boardRect.left +
    "px";

    objectMenu.style.top =
    rect.top -
    boardRect.top -
    40 +
    "px";

}


function deleteSelected(){

    if(
    selectedObject
    ){

        selectedObject.remove();

        selectedObject =
        null;

        objectMenu.style.display =
        "none";

    }

}


/* =================================
   HISTORY
================================= */

function saveHistory(){

    const data =
    canvas.toDataURL();

    history.push(
    data
    );

    if(
    history.length >
    30
    ){

        history.shift();

    }

    redoHistory =
    [];

    localStorage.setItem(
    "coolboard",
    data
    );

}


function undo(){

    if(
    history.length < 2
    )
    return;

    redoHistory.push(
    history.pop()
    );

    restoreImage(
    history[
    history.length-1
    ]
    );

}


function redo(){

    if(
    redoHistory.length ===
    0
    )
    return;

    const data =
    redoHistory.pop();

    history.push(
    data
    );

    restoreImage(
    data
    );

}


function restoreImage(data){

    const image =
    new Image();

    image.onload =
    () => {

        ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
        );

        ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
        );

    };

    image.src =
    data;

}


/* =================================
   CLEAR
================================= */

function clearBoard(){

    if(
    !confirm(
    "বোর্ড পরিষ্কার করতে চাও?"
    )
    )
    return;

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
    );

    document
    .querySelectorAll(
    ".emoji-object"
    )
    .forEach(
    e => e.remove()
    );

    saveHistory();

}


/* =================================
   BOARD COLOR
================================= */

boardColor.addEventListener(
"input",
() => {

    board.style.background =
    boardColor.value;

});


/* =================================
   EXPORT
================================= */

function exportBoard(){

    const exportCanvas =
    document.createElement(
    "canvas"
    );

    exportCanvas.width =
    canvas.width;

    exportCanvas.height =
    canvas.height;

    const exportCtx =
    exportCanvas.getContext(
    "2d"
    );

    exportCtx.fillStyle =
    boardColor.value;

    exportCtx.fillRect(
    0,
    0,
    exportCanvas.width,
    exportCanvas.height
    );

    exportCtx.drawImage(
    canvas,
    0,
    0
    );


    const link =
    document.createElement(
    "a"
    );

    link.download =
    "CoolBoard.png";

    link.href =
    exportCanvas.toDataURL();

    link.click();

}


/* =================================
   MODE
================================= */

function setMode(
mode,
button
){

    document
    .querySelectorAll(
    ".mode-btn"
    )
    .forEach(
    btn =>
    btn.classList.remove(
    "active"
    )
    );

    button
    .classList
    .add(
    "active"
    );


    document
    .querySelectorAll(
    ".advanced"
    )
    .forEach(
    tool => {

        tool.style.display =
        mode === "advanced"
        ?
        "block"
        :
        "none";

    });

}


/* =================================
   START
================================= */

saveHistory();

</script>

</body>
</html>
